<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecDash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Crect x='9' y='23' width='5' height='8' rx='2' fill='%23fff' opacity='.75'/%3E%3Crect x='17.5' y='17' width='5' height='14' rx='2' fill='%23fff'/%3E%3Crect x='26' y='13' width='5' height='18' rx='2' fill='%23fff' opacity='.75'/%3E%3Ccircle cx='28.5' cy='7.5' r='2.8' fill='%23fbbf24'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#6b7280; --line:#e5e7eb;
    --primary:#2563eb; --primary-text:#fff; --danger:#dc2626; --head:#f1f5f9;
    --red:#dc2626; --orange:#d97706; --blue:#2563eb; --purple:#7c3aed; --green:#16a34a; --teal:#0d9488; --pink:#db2777; --gray:#6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#181c25; --text:#e6e9ef; --muted:#97a0af; --line:#2a303c;
            --primary:#3b82f6; --danger:#f87171; --head:#1f2430;
            --red:#f87171; --orange:#fbbf24; --blue:#60a5fa; --purple:#a78bfa; --green:#4ade80; --teal:#2dd4bf; --pink:#f472b6; --gray:#9ca3af; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:10px 20px; position:sticky; top:0; z-index:5;
           background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
           border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; flex:none; user-select:none; }
  .brand svg { width:38px; height:38px; flex:none; filter:drop-shadow(0 3px 8px color-mix(in srgb, var(--purple) 40%, transparent)); }
  .brand .name { font-size:20px; font-weight:800; letter-spacing:-.03em; line-height:1.1; }
  .brand .name > span:not(.tag) { background:linear-gradient(90deg, var(--blue), var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand .tag { display:block; font-size:10.5px; font-weight:500; letter-spacing:.02em; color:var(--muted); }
  .nav { display:flex; gap:4px; flex:1; overflow-x:auto; margin:0 6px; scrollbar-width:none; }
  .nav::-webkit-scrollbar { display:none; }
  .user { display:flex; align-items:center; gap:10px; flex:none; }
  .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; color:#fff; background:linear-gradient(135deg, var(--blue), var(--purple)); }
  #who { color:var(--muted); font-size:13px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { max-width:1200px; margin:0 auto; padding:20px; }
  button, input, select { font:inherit; color:inherit; }
  .btn { padding:8px 14px; border:1px solid var(--line); background:var(--card); border-radius:8px; cursor:pointer; }
  .btn:hover:not(:disabled) { background:var(--head); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { background:var(--primary); color:var(--primary-text); border-color:var(--primary); }
  .btn.danger { color:var(--danger); }
  .btn.sm { padding:4px 10px; font-size:13px; }
  input, select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); width:100%; }
  input[type=checkbox] { width:auto; }
  .tab { padding:7px 14px; border-radius:10px; border:0; background:transparent; color:var(--muted); font-weight:600; cursor:pointer; white-space:nowrap; }
  .tab:hover { background:var(--head); color:var(--text); }
  .tab.active { background:color-mix(in srgb, var(--primary) 14%, transparent); color:var(--primary); }
  .login .brand { justify-content:center; margin-bottom:2px; }
  .login .sub { text-align:center; color:var(--muted); margin:-4px 0 6px; font-size:13px; }

  /* ringkasan */
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .stat, .grp { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 14px; }
  .stat b { font-size:18px; display:block; line-height:1.2; }
  .stat span, .grp .lbl { color:var(--muted); font-size:12px; }
  .grp { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .note { color:var(--muted); font-size:12px; align-self:center; }

  /* toolbar */
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .toolbar .grow { flex:1; min-width:180px; }
  .toolbar input[type=date], .toolbar select { width:auto; }
  .toolbar label { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
  .seg { display:flex; gap:4px; }
  .chip { padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:13px; }
  .chip.active { background:var(--text); color:var(--bg); border-color:var(--text); }

  /* tabel */
  h2.sec { font-size:15px; margin:4px 0 8px; }
  .wrap { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:var(--head); font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); white-space:nowrap; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--text); }
  tr:last-child td { border-bottom:0; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.act { white-space:nowrap; text-align:right; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  .dim { opacity:.45; transition:opacity .15s; }
  a { color:var(--primary); }
  .ganti { margin-top:4px; font-size:12px; font-weight:600; color:var(--blue); cursor:pointer; white-space:nowrap; }
  .ganti i { color:var(--muted); font-weight:400; }
  .scanst { font-size:12px; color:var(--muted); margin-top:4px; }
  input.auto { background:color-mix(in srgb, var(--orange) 16%, var(--card)); }
  .sep { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px; margin-top:2px; }
  input.tick { width:18px; height:18px; cursor:pointer; accent-color:var(--primary); }
  .itm { white-space:nowrap; }
  .itm b { margin-left:6px; color:var(--muted); font-weight:600; }
  .clamp { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-width:260px; cursor:pointer; }
  .clamp.open { display:block; -webkit-line-clamp:unset; }
  .pager { display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:8px 2px 0; color:var(--muted); font-size:13px; min-height:36px; }
  details#closedSec { margin-top:24px; }
  details#closedSec > summary { cursor:pointer; font-weight:600; font-size:15px; margin-bottom:8px; }

  /* badge */
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; color:var(--c); background:color-mix(in srgb, var(--c) 15%, transparent); }
  select.sel { width:auto; min-width:130px; padding:4px 8px; border-radius:999px; font-size:12px; font-weight:600; color:var(--c); background:color-mix(in srgb, var(--c) 15%, var(--card)); border-color:transparent; cursor:pointer; }
  .b-red{--c:var(--red)} .b-orange{--c:var(--orange)} .b-blue{--c:var(--blue)} .b-purple{--c:var(--purple)}
  .b-green{--c:var(--green)} .b-teal{--c:var(--teal)} .b-pink{--c:var(--pink)} .b-gray{--c:var(--gray)}

  /* dialog */
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); padding:0; width:min(480px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg-head { padding:16px 20px; border-bottom:1px solid var(--line); font-weight:600; }
  .dlg-body { padding:16px 20px; display:grid; gap:12px; max-height:65vh; overflow:auto; }
  .dlg-body label, .dlg-body .field { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  .dlg-body label.chk { display:flex; align-items:center; gap:8px; color:var(--text); }
  .item-row { display:grid; grid-template-columns:1fr 76px auto; gap:6px; margin-bottom:6px; }
  .dlg-foot { padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
  .login { max-width:360px; margin:12vh auto; padding:24px; background:var(--card); border:1px solid var(--line); border-radius:14px; display:grid; gap:12px; }
  .login h1 { margin:0 0 4px; font-size:20px; }
  .err { color:var(--danger); font-size:13px; min-height:18px; }
  .hidden { display:none !important; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; max-width:90vw; }
  #toast.show { opacity:1; }

  /* HP: tabel jadi kartu */
  @media (max-width:700px) {
    header { flex-wrap:wrap; gap:8px 12px; padding:10px 12px; }
    .brand .tag, #who { display:none; }
    .user { margin-left:auto; }
    .nav { order:3; flex:0 0 100%; margin:0; }
    main { padding:12px; }
    table { min-width:0; }
    thead { display:none; }
    tr { display:block; padding:10px 12px; border-bottom:1px solid var(--line); }
    tr:last-child { border-bottom:0; }
    td { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border:0; padding:4px 0; text-align:right; }
    td::before { content:attr(data-label); color:var(--muted); font-size:12px; text-align:left; flex:none; padding-top:2px; }
    td.act { justify-content:flex-end; padding-top:8px; }
    td.act::before { content:none; }
    .clamp { max-width:60vw; }
    .pager { justify-content:center; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 40 40">
    <defs><linearGradient id="rdG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
    <rect width="40" height="40" rx="11" fill="url(#rdG)"/>
    <rect x="9" y="23" width="5" height="8" rx="2" fill="#fff" opacity=".75"/>
    <rect x="17.5" y="17" width="5" height="14" rx="2" fill="#fff"/>
    <rect x="26" y="13" width="5" height="18" rx="2" fill="#fff" opacity=".75"/>
    <circle cx="28.5" cy="7.5" r="2.8" fill="#fbbf24"/>
  </symbol>
</svg>

<!-- LOGIN -->
<form id="login" class="login hidden">
  <div class="brand"><svg><use href="#logo"/></svg><div class="name">Rec<span>Dash</span></div></div>
  <p class="sub">Dashboard rekap pembatalan &amp; resi</p>
  <input id="email" type="email" placeholder="Email" required autocomplete="username">
  <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
  <div id="loginErr" class="err"></div>
  <button class="btn primary" type="submit">Masuk</button>
</form>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="brand"><svg><use href="#logo"/></svg><div class="name">Rec<span>Dash</span><span class="tag">Rekap Cancel &amp; Resi</span></div></div>
    <nav class="nav" id="tabs"></nav>
    <div class="user"><span id="who"></span><div class="avatar" id="avatar"></div><button id="logout" class="btn sm">Keluar</button></div>
  </header>
  <main>
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input id="q" class="grow" placeholder="Cari no pesanan, resi, barang, dll…">
      <button id="addBtn" class="btn primary">+ Tambah</button>
    </div>
    <div class="toolbar">
      <div class="seg" id="presets">
        <button class="chip" data-p="hari">Hari ini</button>
        <button class="chip" data-p="minggu">7 hari</button>
        <button class="chip" data-p="bulan">Bulan ini</button>
        <button class="chip" data-p="semua">Semua</button>
      </div>
      <label>Dari <input id="from" type="date"></label>
      <label>Sampai <input id="to" type="date"></label>
      <select id="size" title="Baris per halaman"><option>25</option><option>50</option><option>100</option></select>
      <button id="exportBtn" class="btn">⬇ CSV</button>
      <button id="arsipBtn" class="btn">🗄 Arsip</button>
    </div>

    <h2 id="openTitle" class="sec hidden"></h2>
    <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty hidden"></div></div>
    <div class="pager" id="pager"></div>

    <details id="closedSec" class="hidden">
      <summary id="closedTitle"></summary>
      <div class="wrap"><table><thead id="thead2"></thead><tbody id="tbody2"></tbody></table><div id="empty2" class="empty hidden"></div></div>
      <div class="pager" id="pager2"></div>
    </details>
  </main>
</div>

<!-- Form tambah / edit -->
<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="dlg-head" id="dlgTitle"></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="cancelBtn">Batal</button>
      <button type="submit" class="btn primary" id="saveBtn">Simpan</button>
    </div>
  </form>
</dialog>

<!-- Pertanyaan lanjutan keputusan -->
<dialog id="dlgFollow">
  <form method="dialog" id="formFollow">
    <div class="dlg-head" id="followTitle"></div>
    <div class="dlg-body">
      <label><span id="followAsk"></span>
        <input id="followText" type="text" autocomplete="off">
        <select id="followSelect"></select>
      </label>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="followCancel">Batal</button>
      <button type="submit" class="btn primary">Simpan</button>
    </div>
  </form>
</dialog>

<!-- Penggantian Akurat & PIC -->
<dialog id="dlgAkurat">
  <form method="dialog" id="formAkurat">
    <div class="dlg-head">Penggantian di Akurat</div>
    <div class="dlg-body">
      <label>Tgl Penggantian Akurat <input type="date" id="akuratTgl"></label>
      <label>PIC <input type="text" id="akuratPic" placeholder="Nama penanggung jawab" autocomplete="off"></label>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="akuratCancel">Batal</button>
      <button type="submit" class="btn primary">Simpan</button>
    </div>
  </form>
</dialog>

<!-- Arsip data lama -->
<dialog id="dlgArsip">
  <form method="dialog" id="formArsip">
    <div class="dlg-head" id="arsipTitle"></div>
    <div class="dlg-body">
      <p style="margin:0;color:var(--muted)">Data lama diunduh sebagai CSV dulu, baru dihapus dari database supaya kuota Supabase lega.</p>
      <label>Data sebelum tanggal <input type="date" id="arsipDate"></label>
      <label class="chk hidden" id="arsipFotoOnly"><input type="checkbox" id="arsipFoto"> Hanya hapus foto (baris data tetap disimpan)</label>
      <div id="arsipCount" style="font-weight:600"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="arsipCancel">Batal</button>
      <button type="submit" class="btn danger" id="arsipGo" disabled>Unduh &amp; Hapus</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG || {};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = 'foto-resi';
const STAT_CAP = 5000;
const MAX_EXPORT = 20000;

// ---------- Konfigurasi ----------
const KEPUTUSAN_OPTS = ['Cancel', 'Ganti kode', 'Kirim setengah', 'Co Ulang', 'Lanjut offline', 'Titip resi'];
const GUDANG_OPTS = ['Tangerang', 'Balikpapan', 'Surabaya', 'Batam'];
const KE_PEMBATALAN = ['Cancel', 'Co Ulang'];
const TOKO_OPTS = ['Tianzhy', 'SerbaBpp', 'Serbajkt'];
// Nama "Pengirim" di label -> toko di rekap. Tambahkan alias baru di sini.
const TOKO_ALIAS = { Tianzhy: ['tianzhy'], SerbaBpp: ['serbabpp'], Serbajkt: ['serbajkt'] };
const KEP_COLOR = { 'Cancel':'red', 'Co Ulang':'orange', 'Ganti kode':'blue', 'Kirim setengah':'purple', 'Lanjut offline':'green', 'Titip resi':'teal' };
const SOL_COLOR = { 'Kompensasi':'blue', 'Retur':'orange', 'Refund':'red', 'Kirim Ulang':'green' };
const PALETTE = ['blue', 'purple', 'teal', 'pink', 'orange', 'green'];
const GROUP_LABEL = { toko:'Toko', gudang:'Gudang', keputusan:'Keputusan', solusi:'Solusi' };

const TABS = {
  pembatalan: {
    label: 'Rekap Pembatalan', table: 'pembatalan', dateKey: 'tanggal', qtyKey: 'qty', statKeys: ['toko'],
    cols: [
      { k:'tanggal', l:'Tanggal', t:'datetime' },
      { k:'toko', l:'Toko', t:'select', opts:TOKO_OPTS, badge:'toko' },
      { k:'no_pesanan', l:'No Pesanan', req:true },
      { k:'items', l:'Barang', t:'items', nameKey:'kode_barang', req:true },
      { k:'alasan', l:'Alasan', clamp:true },
    ],
  },
  kendala_mingguan: {
    label: 'Kendala Mingguan', table: 'kendala_mingguan', dateKey: 'tanggal_komplain', statKeys: ['toko', 'solusi'],
    cols: [
      { k:'tanggal_order', l:'Tanggal Order', t:'date' },
      { k:'tanggal_komplain', l:'Tanggal Komplain', t:'date', req:true },
      { k:'toko', l:'Toko', t:'select', opts:TOKO_OPTS, badge:'toko' },
      { k:'nama_akun', l:'Nama Akun' },
      { k:'no_pesanan', l:'No. Pesanan', req:true },
      { k:'resi', l:'Resi' },
      { k:'kendala', l:'Kendala', clamp:true },
      { k:'solusi', l:'Solusi', t:'select', opts:['Kompensasi','Retur','Refund','Kirim Ulang'], badge:'solusi' },
    ],
  },
  resi_naik: {
    label: 'Resi Naik', table: 'resi_naik', dateKey: 'tanggal', qtyKey: 'qty', closedKey: 'keputusan', afterKeys: ['tgl_ganti_akurat', 'pic'], scan: true, statKeys: ['toko', 'gudang', 'keputusan'],
    // Pertanyaan lanjutan untuk keputusan tertentu
    followups: {
      'Ganti kode': { key:'kode_pengganti', title:'Ganti kode', ask:'Diganti ke kode apa?', type:'text', placeholder:'Contoh: PW-Y 05', prefix:'→ ', empty:'isi kode', error:'Isi kode pengganti', toast:'Diganti ke ' },
      'Titip resi': { key:'gudang_titip', title:'Titip resi', ask:'Titip ke gudang mana?', type:'choice', opts:GUDANG_OPTS, prefix:'→ Gudang ', empty:'pilih gudang', error:'Pilih gudang tujuan titip', toast:'Dititip ke gudang ' },
    },
    openTitle: 'Resi Naik · menunggu keputusan', closedTitle: 'Resi Ditutup',
    cols: [
      { k:'tanggal', l:'Tanggal', t:'date', req:true },
      { k:'toko', l:'Toko', t:'select', opts:TOKO_OPTS, badge:'toko' },
      { k:'gudang', l:'Gudang', t:'choice', opts:GUDANG_OPTS, badge:'gudang' },
      { k:'no_pesanan', l:'No Pesanan', req:true },
      { k:'resi', l:'Resi' },
      { k:'items', l:'Barang', t:'items', nameKey:'barang' },
      { k:'alasan', l:'Alasan', clamp:true },
      { k:'keputusan', l:'Keputusan', t:'inline', opts:KEPUTUSAN_OPTS, badge:'keputusan' },
      { k:'kode_pengganti', l:'Diganti ke kode', formOnly:true, follow:'Ganti kode' },
      { k:'gudang_titip', l:'Titip ke gudang', t:'choice', opts:GUDANG_OPTS, formOnly:true, follow:'Titip resi' },
      { k:'tgl_ganti_akurat', l:'Tgl Penggantian Akurat', t:'date', formOnly:true, after:true },
      { k:'pic', l:'PIC', formOnly:true, after:true },
      { k:'_akurat', l:'Akurat / PIC', t:'akurat', virtual:true, sortKey:'tgl_ganti_akurat' },
      { k:'foto_resi', l:'Foto Resi', t:'file' },
    ],
  },
  returan: {
    label: 'Rekap Returan', table: 'returan', dateKey: 'tgl_datang', qtyKey: 'qty', statKeys: ['toko'],
    sums: [['qty', 'Total qty'], ['qty_rusak', 'Qty rusak'], ['qty_layak', 'Qty layak jual']],
    cols: [
      { k:'tgl_datang', l:'Tgl Datang Barang', t:'date', req:true },
      { k:'tgl_beli', l:'Tgl Beli', t:'date', req:true, noDefault:true },
      { k:'resi', l:'No. Resi', req:true },
      { k:'toko', l:'Nama Toko', t:'select', opts:TOKO_OPTS, badge:'toko', req:true },
      { k:'nama_barang', l:'Nama Barang', req:true },
      { k:'qty', l:'Qty', t:'number', req:true, def:1 },
      { k:'qty_rusak', l:'Qty Rusak', t:'number', req:true, def:0 },
      { k:'qty_layak', l:'Qty Layak Jual', t:'number', req:true, def:0 },
      { k:'keterangan', l:'Keterangan', clamp:true, sep:'Opsional' },
      { k:'no_invoice', l:'No Invoice' },
      { k:'tgl_retur_akurat', l:'Tgl Retur di Akurat', t:'date' },

const S = {
  tab: 'pembatalan', preset: 'bulan', size: 25, started: false,
  sort: { key: 'tanggal', asc: false },
  page: { main: 0, closed: 0 }, total: { main: 0, closed: 0 },
  rows: { main: [], closed: [] },
};
const seq = { main: 0, closed: 0, stats: 0, closedCount: 0 };
let editing = null;

// ---------- Helper ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); };
const ymd = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const localInput = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const cleanQ = v => v.replace(/[%,()"'\\*]/g, ' ').replace(/\s+/g, ' ').trim();
const tab = () => TABS[S.tab];
const colOf = (t, key) => t.cols.find(c => c.k === key);

const itemsOf = (r, c) => Array.isArray(r.items) && r.items.length ? r.items
  : (r[c.nameKey] ? [{ nama: r[c.nameKey], qty: r.qty || 1 }] : []);
const valText = (c, r) => c.t === 'bool' ? (r[c.k] ? 'Ya' : 'Tidak') : c.t === 'items' ? itemsOf(r, c).map(i => `${i.nama} x${i.qty}`).join('; ') : (r[c.k] ?? '');

function colorOf(kind, v) {
  if (!v) return 'gray';
  if (kind === 'keputusan') return KEP_COLOR[v] || 'gray';
  if (kind === 'solusi') return SOL_COLOR[v] || 'gray';
  let h = 0; for (const ch of String(v).toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function fmt(col, v) {
  if (v == null || v === '') return '';
  if (col.t === 'datetime') return new Date(v).toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  if (col.t === 'date') return new Date(v + 'T00:00:00').toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
  if (col.t === 'file') return `<a href="${esc(v)}" target="_blank" rel="noopener">Lihat foto</a>`;
  return esc(v);
}

function selectList(t) {
  const ks = new Set(['id', 'created_at']);
  t.cols.filter(c => !c.virtual).forEach(c => { if (c.t === 'items') { ks.add('items'); ks.add(c.nameKey); ks.add('qty'); } else ks.add(c.k); });
  return [...ks].join(',');
}
function searchKeys(t) {
  return t.cols.filter(c => !c.virtual).flatMap(c => c.t === 'items' ? [c.nameKey] : (['date', 'datetime', 'number', 'file', 'bool'].includes(c.t) ? [] : [c.k]));
}

// Filter tanggal + pencarian, dijalankan di server (Supabase)
function baseFilter(qb, t) {
  const from = $('from').value, to = $('to').value, dc = colOf(t, t.dateKey);
  if (from) qb = qb.gte(t.dateKey, dc.t === 'datetime' ? new Date(from + 'T00:00:00').toISOString() : from);
  if (to) {
    if (dc.t === 'datetime') { const d = new Date(to + 'T00:00:00'); d.setDate(d.getDate() + 1); qb = qb.lt(t.dateKey, d.toISOString()); }
    else qb = qb.lte(t.dateKey, to);
  }
  const q = cleanQ($('q').value);
  if (q) qb = qb.or(searchKeys(t).map(k => `${k}.ilike.%${q}%`).join(','));
  return qb;
}

// ---------- Tab, preset, filter ----------
function renderTabs() {
  $('tabs').innerHTML = Object.entries(TABS).map(([k, t]) =>
    `<button class="tab ${k === S.tab ? 'active' : ''}" data-k="${k}">${t.label}</button>`).join('');
}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  S.tab = b.dataset.k; S.sort = { key: tab().dateKey, asc: false };
  $('q').value = ''; renderTabs(); reload();
});

function applyPreset(p) {
  S.preset = p;
  const now = new Date(); let f = '', t = '';
  if (p === 'hari') f = t = ymd(now);
  else if (p === 'minggu') { const d = new Date(now); d.setDate(d.getDate() - 6); f = ymd(d); }
  else if (p === 'bulan') f = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
  $('from').value = f; $('to').value = t; markPreset();
}
function markPreset() { document.querySelectorAll('#presets .chip').forEach(b => b.classList.toggle('active', b.dataset.p === S.preset)); }
$('presets').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { applyPreset(b.dataset.p); reload(); } });
['from', 'to'].forEach(id => $(id).addEventListener('change', () => { S.preset = 'custom'; markPreset(); reload(); }));
let qTimer; $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(reload, 300); });
$('size').addEventListener('change', () => { S.size = parseInt($('size').value, 10); loadLists(true); });

// ---------- Memuat data ----------
function reload() { loadStats(); loadLists(true); }

function loadLists(reset) {
  const t = tab(), split = !!t.closedKey;
  if (reset) S.page = { main: 0, closed: 0 };
  $('openTitle').classList.toggle('hidden', !split);
  $('closedSec').classList.toggle('hidden', !split);
  loadSection('main');
  if (split) { loadClosedCount(); if ($('closedSec').open) loadSection('closed'); }
}

async function loadSection(sec) {
  const t = tab(), id = ++seq[sec], ids = sec === 'main' ? ['tbody', 'empty'] : ['tbody2', 'empty2'];
  $(ids[0]).classList.add('dim');
  let qb = sb.from(t.table).select(selectList(t), { count: 'exact' });
  qb = baseFilter(qb, t);
  if (t.closedKey) qb = sec === 'closed' ? qb.not(t.closedKey, 'is', null) : qb.is(t.closedKey, null);
  const p = S.page[sec];
  qb = qb.order(S.sort.key, { ascending: S.sort.asc, nullsFirst: false }).order('created_at', { ascending: false })
         .range(p * S.size, p * S.size + S.size - 1);
  const { data, count, error } = await qb;
  if (id !== seq[sec]) return;
  $(ids[0]).classList.remove('dim');
  if (error) {
    if (S.page[sec] > 0) { S.page[sec] = 0; return loadSection(sec); }
    toast('Gagal memuat: ' + error.message); return;
  }
  if (!data.length && p > 0 && count > 0) { S.page[sec] = Math.ceil(count / S.size) - 1; return loadSection(sec); }
  S.rows[sec] = data; S.total[sec] = count || 0;
  renderTable(sec);
}

async function loadClosedCount() {
  const t = tab(), id = ++seq.closedCount;
  let qb = sb.from(t.table).select('id', { count: 'exact', head: true });
  qb = baseFilter(qb, t).not(t.closedKey, 'is', null);
  const { count } = await qb;
  if (id !== seq.closedCount) return;
  S.total.closed = count || 0;
  $('closedTitle').textContent = `${t.closedTitle} · ${S.total.closed} data`;
}

async function loadStats() {
  const t = tab(), id = ++seq.stats;
  const sums = t.sums || (t.qtyKey ? [[t.qtyKey, 'Total qty']] : []);
  let qb = sb.from(t.table).select([...sums.map(x => x[0]), ...t.statKeys].join(','), { count: 'exact' });
  qb = baseFilter(qb, t).order(t.dateKey, { ascending: false }).range(0, STAT_CAP - 1);
  const { data, count, error } = await qb;
  if (id !== seq.stats || error) return;
  const total = count || 0;
  let html = `<div class="stat"><b>${total}</b><span>Data</span></div>`;
  sums.forEach(([k, label]) => { html += `<div class="stat"><b>${data.reduce((n, r) => n + (r[k] || 0), 0)}</b><span>${label}</span></div>`; });
  for (const k of t.statKeys) {
    const g = {}; data.forEach(r => { const v = r[k] || ''; g[v] = (g[v] || 0) + 1; });
    const badges = Object.entries(g).sort((a, b) => b[1] - a[1]).map(([v, n]) =>
      `<span class="badge b-${colorOf(k, v)}">${esc(v || (k === 'keputusan' ? 'Belum diputuskan' : '—'))} · ${n}</span>`).join('');
    html += `<div class="grp"><span class="lbl">${GROUP_LABEL[k] || k}</span>${badges}</div>`;
  }
  if (total > STAT_CAP) html += `<span class="note">Ringkasan dihitung dari ${STAT_CAP} data terbaru.</span>`;
  $('stats').innerHTML = html;
}

// ---------- Render tabel ----------
function cellHtml(c, r) {
  const v = r[c.k];
  if (c.t === 'items') return itemsOf(r, c).map(i => `<div class="itm">${esc(i.nama)}<b>×${i.qty}</b></div>`).join('');
  if (c.t === 'bool') return `<input type="checkbox" class="tick" data-tick="${r.id}" data-k="${c.k}" ${v ? 'checked' : ''} title="${esc(c.l)}">`;
  if (c.t === 'akurat') {
    if (!r.keputusan) return '';   // tombol baru muncul setelah ada keputusan
    if (!r.tgl_ganti_akurat && !r.pic) return `<button class="btn sm" data-akurat="${r.id}">+ Akurat &amp; PIC</button>`;
    const tgl = r.tgl_ganti_akurat ? fmt({ t:'date' }, r.tgl_ganti_akurat) : '<i>tgl?</i>';
    return `<div class="ganti" data-akurat="${r.id}" title="Klik untuk ubah">📅 ${tgl} · ${r.pic ? esc(r.pic) : '<i>PIC?</i>'}</div>`;
  }
  if (c.t === 'inline') {
    const sel = `<select class="sel b-${colorOf(c.badge, v)}" data-inline="${r.id}" data-k="${c.k}"><option value="">— Pilih —</option>${c.opts.map(o => `<option ${v === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    const f = (tab().followups || {})[v];
    const extra = f ? `<div class="ganti" data-follow="${r.id}" title="Klik untuk ubah">${f.prefix}${r[f.key] ? esc(r[f.key]) : `<i>${f.empty}</i>`}</div>` : '';
    return `<div>${sel}${extra}</div>`;
  }
  if (c.t === 'file') return fmt(c, v);
  if (v == null || v === '') return '';
  if (c.badge) return `<span class="badge b-${colorOf(c.badge, v)}">${esc(v)}</span>`;
  if (c.clamp) return `<div class="clamp" title="Klik untuk buka / tutup">${esc(v)}</div>`;
  return fmt(c, v);
}

function renderTable(sec) {
  const t = tab(), list = S.rows[sec];
  const [head, body, empty, pager] = sec === 'main' ? ['thead', 'tbody', 'empty', 'pager'] : ['thead2', 'tbody2', 'empty2', 'pager2'];
  const arrow = k => S.sort.key === k ? (S.sort.asc ? ' ▲' : ' ▼') : '';
  $(head).innerHTML = '<tr>' + t.cols.filter(c => !c.formOnly).map(c => {
    if (c.t === 'file') return `<th>${c.l}</th>`;
    const sk = c.t === 'items' ? c.nameKey : (c.sortKey || c.k);
    return `<th class="sortable" data-sort="${sk}">${c.l}${arrow(sk)}</th>`;
  }).join('') + '<th></th></tr>';
  $(body).innerHTML = list.map(r => '<tr>' + t.cols.filter(c => !c.formOnly).map(c =>
    `<td data-label="${esc(c.l)}" class="${c.t === 'number' ? 'num' : ''}">${cellHtml(c, r)}</td>`).join('') +
    `<td class="act"><button class="btn sm" data-edit="${r.id}">Edit</button> <button class="btn sm danger" data-del="${r.id}">Hapus</button></td></tr>`).join('');
  $(empty).classList.toggle('hidden', list.length > 0);
  $(empty).textContent = sec === 'closed' ? 'Belum ada resi yang ditutup pada filter ini.'
    : t.closedKey ? 'Tidak ada resi yang menunggu keputusan.' : 'Tidak ada data pada filter ini.';
  if (sec === 'main' && t.closedKey) $('openTitle').textContent = `${t.openTitle} · ${S.total.main} data`;
  if (sec === 'closed') $('closedTitle').textContent = `${t.closedTitle} · ${S.total.closed} data`;

  const total = S.total[sec], pages = Math.max(1, Math.ceil(total / S.size)), p = S.page[sec];
  $(pager).innerHTML = total <= S.size ? (total ? `${total} data` : '') :
    `<button class="btn sm" data-pg="-1" data-sec="${sec}" ${p === 0 ? 'disabled' : ''}>‹ Sebelumnya</button>
     <span>Hal ${p + 1} / ${pages} · ${total} data</span>
     <button class="btn sm" data-pg="1" data-sec="${sec}" ${p >= pages - 1 ? 'disabled' : ''}>Berikutnya ›</button>`;
}

document.addEventListener('click', e => {

async function saveInline(id, key, value) {
  const t = tab();
  if ((t.followups || {})[value]) { askFollow(id, value); return; }   // tanya dulu (kode / gudang)
  const patch = { [key]: value || null };
  Object.values(t.followups || {}).forEach(f => { patch[f.key] = null; }); // keputusan lain: hapus jawaban lanjutan
  if (!value) (t.afterKeys || []).forEach(k => { patch[k] = null; });        // resi dibuka lagi: hapus data Akurat & PIC
  const { error } = await sb.from(t.table).update(patch).eq('id', id);
  if (error) toast('Gagal: ' + error.message);
  else toast(!value ? 'Keputusan dikosongkan, resi dibuka lagi'
    : KE_PEMBATALAN.includes(value) ? 'Resi ditutup dan dicatat di Rekap Pembatalan'
    : 'Keputusan tersimpan, resi ditutup');
  reload();
}

async function saveTick(id, key, checked) {
  const { error } = await sb.from(tab().table).update({ [key]: checked }).eq('id', id);
  if (error) { toast('Gagal: ' + error.message); reload(); }
  else { const r = findRow(id); if (r) r[key] = checked; toast(checked ? 'Ditandai ✓' : 'Tanda dihapus'); }

// ---------- Foto: kompres & hapus ----------
async function compressImage(file, maxDim = 1280, quality = 0.7) {
  if (!file.type.startsWith('image/') || file.size < 150 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', quality));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch (_) { return file; }
}
const pathFromUrl = url => { const m = String(url || '').match(new RegExp('/object/public/' + BUCKET + '/(.+)$')); return m ? decodeURIComponent(m[1]) : null; };
async function removePhotos(urls) {
  const paths = urls.map(pathFromUrl).filter(Boolean);
  for (let i = 0; i < paths.length; i += 100) await sb.storage.from(BUCKET).remove(paths.slice(i, i + 100));
}

// ---------- Scan foto resi (barcode + teks) ----------
const ZXING_JS = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const OCR_JS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const scriptCache = {};
const loadScript = src => scriptCache[src] || (scriptCache[src] = new Promise((res, rej) => {
  const el = document.createElement('script'); el.src = src; el.onload = res;
  el.onerror = () => { delete scriptCache[src]; rej(new Error('Gagal memuat library')); };
  document.head.appendChild(el);
}));

// Nomor pesanan Shopee: 6 digit tanggal (YYMMDD) + 8 huruf/angka
function isOrderNo(v) {
  if (!/^\d{6}[A-Z0-9]{8}$/.test(v)) return false;
  const mm = +v.slice(2, 4), dd = +v.slice(4, 6);
  return mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31;
}

async function toCanvas(file, maxDim = 1600) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  if (bmp.close) bmp.close();
  return cv;
}

async function readBarcodes(cv) {
  const out = [];
  if ('BarcodeDetector' in window) {
    try { (await new BarcodeDetector().detect(cv)).forEach(b => out.push(b.rawValue)); } catch (_) {}
  }
  if (!out.length) {
    try {
      await loadScript(ZXING_JS);
      const reader = new ZXing.BrowserMultiFormatReader();
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const url = URL.createObjectURL(blob);
      try { out.push((await reader.decodeFromImageUrl(url)).getText()); } finally { URL.revokeObjectURL(url); }
    } catch (_) {}
  }
  return out;
}

async function readText(cv) {
  await loadScript(OCR_JS);
  const worker = await Tesseract.createWorker('eng');
  try { return (await worker.recognize(cv)).data.text || ''; } finally { await worker.terminate(); }
}

// Ambil kandidat yang paling sering muncul (resi tercetak berkali-kali di label, jadi lebih tahan salah baca)
function topMatch(T, re, ok) {
  const count = {};
  (T.match(re) || []).forEach(m => { if (ok(m)) count[m] = (count[m] || 0) + 1; });
  const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : null;
}

function parseLabel(codes, text) {
  const res = {};
  for (const raw of codes) {
    const v = String(raw).trim(), u = v.toUpperCase();
    if (isOrderNo(u)) res.no_pesanan = res.no_pesanan || u;
    else if (v.length >= 8) res.resi = res.resi || v;
  }
  if (text) {
    const T = text.toUpperCase();
    if (!res.no_pesanan) { const m = topMatch(T, /\b\d{6}[A-Z0-9]{8}\b/g, isOrderNo); if (m) res.no_pesanan = m; }
    if (!res.resi) {
      // bukan nomor pesanan dan bukan nomor HP (62xxxxxxxxxxx)
      const m = topMatch(T, /\b(?:SPX[A-Z0-9]{8,}|JT\d{10,}|\d{12,})\b/g, v => !isOrderNo(v) && !/^62\d{9,12}$/.test(v));
      if (m) res.resi = m;
    }
    const flat = T.replace(/[^A-Z0-9]/g, '');
    const toko = TOKO_OPTS.find(o => (TOKO_ALIAS[o] || [o.toLowerCase()]).some(a => flat.includes(a.toUpperCase())));
    if (toko) res.toko = toko;
  }
  return res;
}

const SCAN_LABEL = { no_pesanan: 'No Pesanan', resi: 'Resi', toko: 'Toko' };
let scanSeq = 0;
async function runScan(file) {
  if (!file) return;
  const id = ++scanSeq, st = $('scanStatus');
  const say = m => { if (id === scanSeq && st) st.textContent = m; };
  try {
    say('⏳ Membaca barcode…');
    const cv = await toCanvas(file);
    const codes = await readBarcodes(cv);
    let res = parseLabel(codes, '');
    if (!res.no_pesanan || !res.toko) {
      say('⏳ Membaca teks di foto… (pertama kali mengunduh data ±10 MB, mohon tunggu)');
      try { res = parseLabel(codes, await readText(cv)); }
      catch (_) { say('Teks gagal dibaca, memakai hasil barcode saja.'); }
    }
    if (id !== scanSeq) return;
    const filled = [];
    for (const [k, v] of Object.entries(res)) {
      const el = $('dlgBody').querySelector(`[name="${k}"]`);
      if (el && (!el.value.trim() || (k === 'toko' && !editing))) { el.value = v; el.classList.add('auto'); filled.push(SCAN_LABEL[k]); }
    }
    say(filled.length ? `✅ Terisi otomatis: ${filled.join(', ')}. Cek dulu sebelum simpan.`
      : '⚠️ Belum ada yang terbaca. Coba foto lebih dekat, terang, dan tidak miring, atau isi manual.');
  } catch (err) { say('⚠️ Gagal membaca foto: ' + err.message); }
}
$('dlgBody').addEventListener('change', e => { if (e.target.type === 'file' && tab().scan) runScan(e.target.files[0]); });
$('dlgBody').addEventListener('input', e => e.target.classList.remove('auto'));

const getLast = k => { try { return localStorage.getItem('last_' + k) || ''; } catch (_) { return ''; } };
const setLast = (k, v) => { try { localStorage.setItem('last_' + k, v); } catch (_) {} };

// ---------- Form tambah / edit ----------
function itemRowHtml(nama = '', qty = 1) {
  return `<div class="item-row"><input class="it-name" type="text" placeholder="Nama / kode barang" value="${esc(nama)}"><input class="it-qty" type="number" min="1" value="${qty}"><button type="button" class="btn sm danger" data-rm>×</button></div>`;
}
function itemsInputHtml(row, c) {
  const list = row ? itemsOf(row, c) : [];
  return `<div id="itemsBox">${(list.length ? list : [{ nama: '', qty: 1 }]).map(i => itemRowHtml(i.nama, i.qty)).join('')}</div><div><button type="button" class="btn sm" id="addItem">+ Tambah barang</button></div>`;
}
$('dlgBody').addEventListener('click', e => {
  if (e.target.id === 'addItem') {
    $('itemsBox').insertAdjacentHTML('beforeend', itemRowHtml());
    $('itemsBox').lastElementChild.querySelector('.it-name').focus();
  } else if (e.target.dataset.rm !== undefined) {
    const box = e.target.closest('#itemsBox'), el = e.target.closest('.item-row');
    if (box.children.length > 1) el.remove();
    else { el.querySelector('.it-name').value = ''; el.querySelector('.it-qty').value = 1; }
  }
});
function defaultVal(c) {
  if (c.k === 'toko' || c.k === 'gudang') return getLast(c.k);
  const now = new Date();
  if (c.t === 'datetime') return now.toISOString();
  if (c.t === 'date' && c.req && !c.noDefault) return ymd(now);
  if (c.t === 'number') return c.def ?? 0;
  return '';
}
function openForm(row = null) {
  const t = tab(); editing = row;
  $('dlgTitle').textContent = (row ? 'Edit ' : 'Tambah ') + t.label;
  const base = t.cols.filter(c => !c.virtual);
  const formCols = t.scan ? [...base.filter(c => c.t === 'file'), ...base.filter(c => c.t !== 'file')] : base;
  $('dlgBody').innerHTML = formCols.map(c => {
    const v = row ? row[c.k] : defaultVal(c);
    const req = c.req ? 'required' : '';
    let input;
    if (c.t === 'select') input = `<input name="${c.k}" list="dl_${c.k}" ${req} value="${esc(v ?? '')}"><datalist id="dl_${c.k}">${c.opts.map(o => `<option value="${o}">`).join('')}</datalist>`;
    else if (c.t === 'items') input = itemsInputHtml(row, c);
    else if (c.t === 'number') input = `<input name="${c.k}" type="number" min="0" ${req} value="${v ?? c.def ?? 0}">`;
    else if (c.t === 'bool') input = '';
    else if (c.t === 'inline' || c.t === 'choice') input = `<select name="${c.k}"><option value="">— Pilih —</option>${c.opts.map(o => `<option ${v === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (c.t === 'datetime') input = `<input name="${c.k}" type="datetime-local" ${req} value="${v ? localInput(v) : ''}">`;
    else if (c.t === 'date') input = `<input name="${c.k}" type="date" ${req} value="${v ?? ''}">`;
    else if (c.t === 'file') input = `<input name="${c.k}" type="file" accept="image/*">${v ? `<a href="${esc(v)}" target="_blank" rel="noopener">Foto saat ini</a>` : ''}${t.scan ? '<div id="scanStatus" class="scanst">Pilih foto resi, data akan terisi otomatis (resi, no pesanan, toko).</div>' : ''}`;
    else input = `<input name="${c.k}" type="text" ${req} value="${esc(v ?? '')}">`;
    const head = `${c.l}${c.req ? ' *' : ''}`;
    const sep = c.sep ? `<div class="sep">${c.sep}</div>` : '';
    if (c.t === 'bool') return `${sep}<label class="chk"><input type="checkbox" name="${c.k}" ${v ? 'checked' : ''}> ${c.l}</label>`;
    const attr = c.follow ? ` data-follow="${esc(c.follow)}"` : c.after ? ' data-after' : '';
    return sep + (c.t === 'items' ? `<div class="field">${head}${input}</div>` : `<label${attr}>${head}${input}</label>`);
  }).join('');
  $('dlg').showModal(); toggleFollow();
}
function toggleFollow() {
  const sel = $('dlgBody').querySelector('[name=keputusan]'); if (!sel) return;
  $('dlgBody').querySelectorAll('[data-follow]').forEach(el => el.classList.toggle('hidden', el.dataset.follow !== sel.value));
  $('dlgBody').querySelectorAll('[data-after]').forEach(el => el.classList.toggle('hidden', !sel.value));  // Akurat & PIC: hanya setelah ada keputusan
}
$('dlgBody').addEventListener('change', e => { if (e.target.name === 'keputusan') toggleFollow(); });
$('addBtn').onclick = () => openForm();
$('cancelBtn').onclick = () => $('dlg').close();

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const t = tab(), fd = new FormData($('form')), payload = {};
  let newPath = null, oldPhoto = null;
  $('saveBtn').disabled = true;
  try {
    for (const c of t.cols) {
      if (c.virtual) continue;
      if (c.t === 'bool') { payload[c.k] = fd.get(c.k) !== null; continue; }
      if (c.t === 'items') {
        const list = [...$('dlgBody').querySelectorAll('.item-row')].map(el => ({
          nama: el.querySelector('.it-name').value.trim(),
          qty: Math.max(1, parseInt(el.querySelector('.it-qty').value || '1', 10)),
        })).filter(i => i.nama);
        if (c.req && !list.length) throw new Error('Isi minimal 1 barang');
        payload.items = list;
        payload.qty = list.reduce((sum, i) => sum + i.qty, 0);
        payload[c.nameKey] = list.length ? list.map(i => i.nama).join(', ') : null;
        continue;
      }
      const v = fd.get(c.k);
      if (c.t === 'file') {
        if (v && v.size) {
          const f = await compressImage(v);
          newPath = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${f.name.replace(/[^\w.\-]/g, '_')}`;
          const { error } = await sb.storage.from(BUCKET).upload(newPath, f, { cacheControl: '31536000', contentType: f.type });
          if (error) { newPath = null; throw error; }
          payload[c.k] = sb.storage.from(BUCKET).getPublicUrl(newPath).data.publicUrl;
          oldPhoto = editing ? editing[c.k] : null;
        }
      } else if (c.t === 'datetime') payload[c.k] = v ? new Date(v).toISOString() : null;
      else if (c.t === 'number') payload[c.k] = Math.max(0, parseInt(v || '0', 10));
      else payload[c.k] = v === '' ? null : v.trim();
    }
    for (const [val, f] of Object.entries(t.followups || {})) {
      if (payload[t.closedKey] === val) { if (!payload[f.key]) throw new Error(f.error); }
      else payload[f.key] = null;
    }
    if (t.afterKeys && !payload[t.closedKey]) t.afterKeys.forEach(k => { payload[k] = null; });  // tanpa keputusan: kosongkan Akurat & PIC
    if (t.table === 'returan' && payload.qty_rusak + payload.qty_layak !== payload.qty) {
      const ok = confirm(`Qty rusak (${payload.qty_rusak}) + layak jual (${payload.qty_layak}) = ${payload.qty_rusak + payload.qty_layak}, tidak sama dengan Qty (${payload.qty}).\nTetap simpan?`);
      if (!ok) { $('saveBtn').disabled = false; return; }
    }
    const q = editing ? sb.from(t.table).update(payload).eq('id', editing.id) : sb.from(t.table).insert(payload);
    const { error } = await q;
    if (error) throw error;
    ['toko', 'gudang'].forEach(k => { if (payload[k]) setLast(k, payload[k]); });
    if (oldPhoto) removePhotos([oldPhoto]);
    $('dlg').close(); toast('Tersimpan'); reload();
  } catch (err) {
    if (newPath) sb.storage.from(BUCKET).remove([newPath]);
    toast('Gagal: ' + err.message);
  }
  $('saveBtn').disabled = false;
});

async function remove(id) {
  if (!confirm('Hapus data ini?')) return;
  const t = tab(), row = findRow(id), fileCol = t.cols.find(c => c.t === 'file');
  const { error } = await sb.from(t.table).delete().eq('id', id);
  if (error) { toast('Gagal: ' + error.message); return; }
  if (fileCol && row && row[fileCol.k]) removePhotos([row[fileCol.k]]);
  toast('Terhapus'); reload();
}

// ---------- Export CSV ----------
async function fetchAll(t, fn, sel) {
  const out = [];
  for (let from = 0; from < MAX_EXPORT; from += 1000) {
    const { data, error } = await fn(sb.from(t.table).select(sel))
      .order(t.dateKey, { ascending: false }).order('id').range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
function toCsv(t, list) {
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const cs = t.cols.filter(c => !c.virtual);
  return [cs.map(c => cell(c.l)).join(',')].concat(list.map(r => cs.map(c => cell(valText(c, r))).join(','))).join('\n');
}
function downloadCsv(name, csv) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click();
}
$('exportBtn').onclick = async () => {
  const t = tab();
  try {
    toast('Menyiapkan CSV…');
    const list = await fetchAll(t, qb => baseFilter(qb, t), selectList(t));
    downloadCsv(`${t.table}-${ymd(new Date())}.csv`, toCsv(t, list));
  } catch (err) { toast('Gagal: ' + err.message); }
};

// ---------- Arsip data lama ----------
const fileKeyOf = t => (t.cols.find(c => c.t === 'file') || {}).k;
function arsipFilter(qb, t, photoOnly) {
  const cutoff = $('arsipDate').value, dc = colOf(t, t.dateKey);
  qb = qb.lt(t.dateKey, dc.t === 'datetime' ? new Date(cutoff + 'T00:00:00').toISOString() : cutoff);
  return photoOnly ? qb.not(fileKeyOf(t), 'is', null) : qb;
}
const arsipPhotoOnly = () => !!fileKeyOf(tab()) && $('arsipFoto').checked;

async function arsipCount() {
  const t = tab(), out = $('arsipCount'), fk = fileKeyOf(t), photoOnly = arsipPhotoOnly();
  $('arsipGo').disabled = true;
  if (!$('arsipDate').value) { out.textContent = ''; return; }
  out.textContent = 'Menghitung…';
  const head = () => sb.from(t.table).select('id', { count: 'exact', head: true });
  const { count, error } = await arsipFilter(head(), t, photoOnly);
  if (error) { out.textContent = 'Gagal menghitung: ' + error.message; return; }
  let extra = '';
  if (fk && !photoOnly) { const r2 = await arsipFilter(head(), t, true); extra = ` · ${r2.count || 0} foto`; }
  out.textContent = `${count || 0} ${photoOnly ? 'foto' : 'data'} ditemukan${extra}.`;
  $('arsipGo').disabled = !count;
}
$('arsipBtn').onclick = () => {
  const t = tab(), d = new Date(); d.setDate(d.getDate() - 90);
  $('arsipTitle').textContent = 'Arsipkan data lama · ' + t.label;
  $('arsipDate').value = ymd(d); $('arsipFoto').checked = false;
  $('arsipFotoOnly').classList.toggle('hidden', !fileKeyOf(t));
  $('dlgArsip').showModal(); arsipCount();
};
$('arsipDate').addEventListener('change', arsipCount);
$('arsipFoto').addEventListener('change', arsipCount);
$('arsipCancel').onclick = () => $('dlgArsip').close();

$('formArsip').addEventListener('submit', async e => {
  e.preventDefault();
  const t = tab(), fk = fileKeyOf(t), photoOnly = arsipPhotoOnly();
  $('arsipGo').disabled = true;
  try {
    toast('Mengambil data…');
    const list = await fetchAll(t, qb => arsipFilter(qb, t, photoOnly), selectList(t));
    if (!list.length) throw new Error('Tidak ada data');
    if (!photoOnly) downloadCsv(`arsip-${t.table}-sebelum-${$('arsipDate').value}.csv`, toCsv(t, list));
    const msg = photoOnly ? `Hapus ${list.length} foto lama? Baris datanya tetap disimpan.`
      : `CSV sudah diunduh. Hapus ${list.length} data dari database sekarang?`;
    if (!confirm(msg)) return;
    const ids = list.map(r => r.id);
    for (let i = 0; i < ids.length; i += 100) {
      const chunk = ids.slice(i, i + 100);
      const { error } = photoOnly ? await sb.from(t.table).update({ [fk]: null }).in('id', chunk)
                                  : await sb.from(t.table).delete().in('id', chunk);
      if (error) throw error;
    }
    if (fk) await removePhotos(list.map(r => r[fk]).filter(Boolean));
    $('dlgArsip').close(); toast(photoOnly ? 'Foto lama dihapus' : 'Data lama diarsipkan'); reload();
  } catch (err) { toast('Gagal: ' + err.message); }
  finally { $('arsipGo').disabled = false; }
});

init();
</script>
